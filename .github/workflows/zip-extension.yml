name: Package extension

# Manual-only until 2026-08-04, which meant the published zip silently rotted: it was
# last built 2026-07-19, before licensing existed, while landing.html and start.html
# kept linking to it as the manual-install download. Anyone who took that link got an
# extension with no license.js at all. Build it on every change to extension/ instead.
on:
  push:
    branches: [main]
    paths: ["extension/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the extension folder
        run: |
          cd extension
          zip -r ../offeraio-extension.zip .
      - name: Publish to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-latest
          name: OfferAIO Extension (latest)
          body: "Chrome extension package. Unzip then load unpacked, or upload the zip to the Chrome Web Store."
          files: offeraio-extension.zip
